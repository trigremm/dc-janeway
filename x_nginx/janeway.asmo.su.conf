# /etc/nginx/sites-available/janeway.asmo.su.conf
# HTTP-only vhost. The 443 server block and HTTP->HTTPS redirect are added
# by `certbot --nginx --redirect` on first deploy (see makefile_nginx.mk).
#
# NOTE — the /static/ and /media/ `alias` paths below assume the repo is cloned
# at /home/asmo/dc-janeway (the `make howto-deploy` convention: clone into
# ~/dc-janeway on the target host). If this checkout lives elsewhere, edit those
# two alias directives to <repo>/backend/janeway/src/collected-static/ and
# <repo>/.docker_volumes/media/ respectively — these are the host sides of the
# docker-compose bind mounts (Django's STATIC_ROOT=BASE_DIR/collected-static,
# MEDIA_ROOT=BASE_DIR/media).

server {
    listen 80;
    listen [::]:80;
    server_name janeway.asmo.su;

    # ACME challenge (webroot fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 128M;

    # Compress text assets before they leave nginx.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff;

    # Security headers (defence-in-depth; Django sets its own too)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/janeway.asmo.su.access.log;
    error_log  /var/log/nginx/janeway.asmo.su.error.log;

    # Collected static (Django STATIC_ROOT = backend/janeway/src/collected-static)
    # served straight off disk — never proxied through gunicorn.
    location /static/ {
        alias /home/asmo/dc-janeway/backend/janeway/src/collected-static/;
        expires 30d;
        access_log off;
    }

    # User uploads (Django MEDIA_ROOT, bind-mounted from .docker_volumes/media).
    location /media/ {
        alias /home/asmo/dc-janeway/.docker_volumes/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
