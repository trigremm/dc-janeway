# /etc/nginx/sites-available/janeway.asmo.su.conf
# Symlink to /etc/nginx/sites-enabled/ and reload nginx.
#
# Prerequisites:
#   certbot certonly --nginx -d janeway.asmo.su

server {
    listen 80;
    listen [::]:80;
    server_name janeway.asmo.su;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name janeway.asmo.su;

    ssl_certificate     /etc/letsencrypt/live/janeway.asmo.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janeway.asmo.su/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 128M;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/janeway.asmo.su.access.log;
    error_log  /var/log/nginx/janeway.asmo.su.error.log;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
